# Sample workload (echo server), deployed by the sample ApplicationSets only.
# No namespace here: each generated Application sets its destination namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs: {app.kubernetes.io/name: hello, app.kubernetes.io/part-of: samples}
    includeSelectors: true
resources: [deployment.yaml, service.yaml]
