<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="t d" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13">
<title id="t">gitops: a team's bounds</title>
<desc id="d">The platform decides where a team may deploy, from applications/; the team decides what, from its own repositories.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs>
<rect width="900" height="610" fill="#ffffff"/>
<text x="20" y="32.0" text-anchor="start" font-size="18" fill="#1f2933" font-weight="600">gitops — a team's bounds</text>
<text x="20" y="52.0" text-anchor="start" font-size="12" fill="#52606d">The platform decides where a team may deploy; the team decides what.</text>
<rect x="20" y="80" width="260" height="100" rx="8" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
<text x="150.0" y="117.5" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">this repository (platform)</text>
<text x="150.0" y="134.6" text-anchor="middle" font-size="12" fill="#52606d">applications/&lt;org&gt;/&lt;team&gt;/team.yaml</text>
<text x="150.0" y="151.6" text-anchor="middle" font-size="12" fill="#52606d">&lt;ns&gt;/base, &lt;ns&gt;/env/&lt;env&gt;</text>
<rect x="320" y="80" width="260" height="100" rx="8" fill="#eef0f2" stroke="#7b8794" stroke-width="1.5"/>
<text x="450.0" y="109.0" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">site services (Crossplane)</text>
<text x="450.0" y="126.0" text-anchor="middle" font-size="12" fill="#52606d">Keycloak group, Forgejo team</text>
<text x="450.0" y="143.1" text-anchor="middle" font-size="12" fill="#52606d">repositories, Harbor project</text>
<text x="450.0" y="160.1" text-anchor="middle" font-size="12" fill="#52606d">Artifact Keeper repositories</text>
<rect x="620" y="80" width="260" height="100" rx="8" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
<text x="750.0" y="117.5" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">the team's repositories</text>
<text x="750.0" y="134.6" text-anchor="middle" font-size="12" fill="#52606d">&lt;team&gt;-gitops: apps/</text>
<text x="750.0" y="151.6" text-anchor="middle" font-size="12" fill="#52606d">&lt;team&gt;-&lt;app&gt;: code, deploy/, .tekton/</text>
<rect x="20" y="222" width="260" height="70" rx="8" fill="#e3f4e8" stroke="#2f8a4c" stroke-width="1.5"/>
<text x="150.0" y="253.1" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">platform Argo CD</text>
<text x="150.0" y="270.1" text-anchor="middle" font-size="12" fill="#52606d">ApplicationSets, project tenants</text>
<path d="M150,180 L150,222" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M280,240 L320,160" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="240.0" y="187" width="57.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="292" y="201.0" text-anchor="end" font-size="12" fill="#52606d">creates</text>
<rect x="20" y="330" width="860" height="200" rx="8" fill="#e8f1fb" stroke="#4a7fc1" stroke-width="1.5"/>
<text x="32" y="350.0" text-anchor="start" font-size="13" fill="#4a7fc1" font-weight="600">cluster lab</text>
<path d="M150,292 L150,330" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="155.0" y="305" width="157.8" height="19" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="160" y="319.0" text-anchor="start" font-size="12" fill="#52606d">creates the namespaces</text>
<rect x="40" y="366" width="250" height="100" rx="8" fill="#e3f4e8" stroke="#2f8a4c" stroke-width="1.5"/>
<text x="165.0" y="395.1" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">&lt;env&gt;-&lt;team&gt;-&lt;ns&gt;</text>
<text x="165.0" y="412.1" text-anchor="middle" font-size="12" fill="#52606d">quota, network policy</text>
<text x="165.0" y="429.1" text-anchor="middle" font-size="12" fill="#52606d">Pod Security restricted</text>
<text x="165.0" y="446.1" text-anchor="middle" font-size="12" fill="#52606d">ListenerSet, certificate</text>
<rect x="325" y="366" width="250" height="100" rx="8" fill="#e3f4e8" stroke="#2f8a4c" stroke-width="1.5"/>
<text x="450.0" y="403.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">ci-&lt;team&gt;</text>
<text x="450.0" y="420.6" text-anchor="middle" font-size="12" fill="#52606d">pipelines as user ci-&lt;team&gt;</text>
<text x="450.0" y="437.6" text-anchor="middle" font-size="12" fill="#52606d">Pod Security baseline</text>
<rect x="610" y="366" width="250" height="100" rx="8" fill="#e3f4e8" stroke="#2f8a4c" stroke-width="1.5"/>
<text x="735.0" y="403.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">team-&lt;team&gt;</text>
<text x="735.0" y="420.6" text-anchor="middle" font-size="12" fill="#52606d">the team's Argo CD</text>
<text x="735.0" y="437.6" text-anchor="middle" font-size="12" fill="#52606d">its Tekton Dashboard</text>
<path d="M750,180 L735,366" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="747.0" y="287" width="83.9" height="19" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="752" y="301.0" text-anchor="start" font-size="12" fill="#52606d">syncs apps/</text>
<path d="M680,180 L480,366" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="566.5" y="249" width="57.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="595" y="263.0" text-anchor="middle" font-size="12" fill="#52606d">webhook</text>
<path d="M400,366 L420,180" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="362.3" y="249" width="97.4" height="19" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="411" y="263.0" text-anchor="middle" font-size="12" fill="#52606d">pushes images</text>
<path d="M735,466 L735,500 L165,500 L165,466" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="334.1" y="491" width="231.8" height="19" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="450" y="505.0" text-anchor="middle" font-size="12" fill="#52606d">deploys, to its environments only</text>
<text x="450" y="566.0" text-anchor="middle" font-size="12" fill="#52606d">The team's Argo CD may write only its namespaces, through ClusterRole team-deployer: no quotas, network policies,</text>
<text x="450" y="584.0" text-anchor="middle" font-size="12" fill="#52606d">listeners or anything cluster-wide. Admission policies keep host names and routes within the team.</text>
</svg>
