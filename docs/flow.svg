<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img" aria-labelledby="t d" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13">
<title id="t">gitops: from a pull request to the cluster</title>
<desc id="d">A pull request is checked by rendering before it merges; each cluster's Argo CD applies main; Crossplane carries objects into the site's services.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs>
<rect width="900" height="660" fill="#ffffff"/>
<text x="20" y="32.0" text-anchor="start" font-size="18" fill="#1f2933" font-weight="600">gitops — from a pull request to the cluster</text>
<text x="20" y="52.0" text-anchor="start" font-size="12" fill="#52606d">Every change is rendered before it merges; only deploy-talos.py writes to main directly.</text>
<rect x="20" y="92" width="170" height="64" rx="8" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
<text x="105.0" y="120.0" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">you</text>
<text x="105.0" y="137.1" text-anchor="middle" font-size="12" fill="#52606d">a branch, a pull request</text>
<rect x="250" y="80" width="300" height="172" rx="8" fill="#eef0f2" stroke="#7b8794" stroke-width="1.5"/>
<text x="262" y="100.0" text-anchor="start" font-size="13" fill="#7b8794" font-weight="600">Forgejo · alice/gitops</text>
<rect x="270" y="110" width="260" height="52" rx="8" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
<text x="400.0" y="132.1" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">pull request</text>
<text x="400.0" y="149.1" text-anchor="middle" font-size="12" fill="#52606d">status, report, pac-bot's commit</text>
<rect x="270" y="186" width="260" height="52" rx="8" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
<text x="400.0" y="208.1" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">main (protected)</text>
<text x="400.0" y="225.1" text-anchor="middle" font-size="12" fill="#52606d">merges only when the check is green</text>
<rect x="600" y="80" width="280" height="172" rx="8" fill="#e8f1fb" stroke="#4a7fc1" stroke-width="1.5"/>
<text x="612" y="100.0" text-anchor="start" font-size="13" fill="#4a7fc1" font-weight="600">merge check · gitops-ci</text>
<rect x="615" y="110" width="250" height="56" rx="8" fill="#e3f4e8" stroke="#2f8a4c" stroke-width="1.5"/>
<text x="740.0" y="134.1" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">tools/ scripts</text>
<text x="740.0" y="151.1" text-anchor="middle" font-size="12" fill="#52606d">check the tree; generate what follows</text>
<rect x="615" y="176" width="250" height="62" rx="8" fill="#e3f4e8" stroke="#2f8a4c" stroke-width="1.5"/>
<text x="740.0" y="194.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">gitops-check</text>
<text x="740.0" y="211.6" text-anchor="middle" font-size="12" fill="#52606d">renders before and after</text>
<text x="740.0" y="228.6" text-anchor="middle" font-size="12" fill="#52606d">with argocd-preview</text>
<path d="M190,124 L270,136" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="209.6" y="105" width="36.9" height="19" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="228" y="119.0" text-anchor="middle" font-size="12" fill="#52606d">push</text>
<path d="M530,128 L615,128" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M615,150 L530,150" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="536.2" y="96" width="71.6" height="18" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="572" y="109.0" text-anchor="middle" font-size="11" fill="#52606d">runs on it</text>
<path d="M400,162 L400,186" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="428.2" y="165" width="43.6" height="19" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="450" y="179.0" text-anchor="middle" font-size="12" fill="#52606d">merge</text>
<rect x="20" y="196" width="190" height="64" rx="8" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
<text x="115.0" y="224.1" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">deploy-talos.py</text>
<text x="115.0" y="241.1" text-anchor="middle" font-size="12" fill="#52606d">the add-ons it renders</text>
<path d="M210,228 L270,222" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5 4"/>
<rect x="214.8" y="233" width="50.3" height="19" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="240" y="247.0" text-anchor="middle" font-size="12" fill="#52606d">pushes</text>
<rect x="20" y="300" width="860" height="252" rx="8" fill="#e8f1fb" stroke="#4a7fc1" stroke-width="1.5"/>
<text x="32" y="320.0" text-anchor="start" font-size="13" fill="#4a7fc1" font-weight="600">each cluster · clusters/&lt;name&gt;/</text>
<rect x="40" y="336" width="250" height="76" rx="8" fill="#e3f4e8" stroke="#2f8a4c" stroke-width="1.5"/>
<text x="165.0" y="361.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">Argo CD</text>
<text x="165.0" y="378.6" text-anchor="middle" font-size="12" fill="#52606d">app-of-apps addons:</text>
<text x="165.0" y="395.6" text-anchor="middle" font-size="12" fill="#52606d">clusters/&lt;name&gt;/addons/</text>
<path d="M400,238 L400,270 L262,270 L262,336" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="265.5" y="261" width="131.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="331" y="275.0" text-anchor="middle" font-size="12" fill="#52606d">polls main (3 min)</text>
<rect x="330" y="336" width="250" height="76" rx="8" fill="#e3f4e8" stroke="#2f8a4c" stroke-width="1.5"/>
<text x="455.0" y="370.1" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">Applications, ApplicationSets</text>
<text x="455.0" y="387.1" text-anchor="middle" font-size="12" fill="#52606d">each bounded by an AppProject</text>
<rect x="620" y="336" width="240" height="76" rx="8" fill="#e3f4e8" stroke="#2f8a4c" stroke-width="1.5"/>
<text x="740.0" y="361.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">Kubernetes objects</text>
<text x="740.0" y="378.6" text-anchor="middle" font-size="12" fill="#52606d">add-ons, services, teams'</text>
<text x="740.0" y="395.6" text-anchor="middle" font-size="12" fill="#52606d">namespaces, CI</text>
<path d="M290,374 L330,374" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M580,374 L620,374" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="330" y="452" width="250" height="76" rx="8" fill="#fde8e1" stroke="#c4572e" stroke-width="1.5"/>
<text x="455.0" y="477.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">Crossplane providers</text>
<text x="455.0" y="494.6" text-anchor="middle" font-size="12" fill="#52606d">managed resources from Git</text>
<text x="455.0" y="511.6" text-anchor="middle" font-size="12" fill="#52606d">(cluster lab only)</text>
<path d="M455,412 L455,452" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="250" y="584" width="410" height="60" rx="8" fill="#eef0f2" stroke="#7b8794" stroke-width="1.5"/>
<text x="455.0" y="610.0" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="600">Keycloak, Forgejo, Harbor, Artifact Keeper</text>
<text x="455.0" y="627.0" text-anchor="middle" font-size="12" fill="#52606d">groups, clients, teams, repositories, projects, robots</text>
<path d="M455,528 L455,584" fill="none" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="495.0" y="549" width="77.2" height="19" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="500" y="563.0" text-anchor="start" font-size="12" fill="#52606d">their APIs</text>
</svg>
