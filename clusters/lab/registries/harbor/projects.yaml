# The platform's projects: public (anyone may pull: the clusters pull without credentials), scanned by
# Trivy on push. Pushed to by the CI of their repositories (robot accounts
# with their pipelines). Never deleted by Crossplane (no Delete: a project
# holds images).
apiVersion: harbor.m.crossplane.io/v1alpha1
kind: Project
metadata:
  name: providers
  annotations:
    description: "Crossplane provider packages built here (provider-forgejo)"
spec:
  managementPolicies: [Observe, Create, Update, LateInitialize]
  providerConfigRef: {kind: ClusterProviderConfig, name: default}
  forProvider:
    name: providers
    public: true
    vulnerabilityScanning: true
---
apiVersion: harbor.m.crossplane.io/v1alpha1
kind: Project
metadata:
  name: gitops-scanner
  annotations:
    description: "The gitops merge check's image"
spec:
  managementPolicies: [Observe, Create, Update, LateInitialize]
  providerConfigRef: {kind: ClusterProviderConfig, name: default}
  forProvider:
    name: gitops-scanner
    public: true
    vulnerabilityScanning: true
---
apiVersion: harbor.m.crossplane.io/v1alpha1
kind: Project
metadata:
  name: pac-demo
  annotations:
    description: "Images of the pac-demo pipeline"
spec:
  managementPolicies: [Observe, Create, Update, LateInitialize]
  providerConfigRef: {kind: ClusterProviderConfig, name: default}
  forProvider:
    name: pac-demo
    public: true
    vulnerabilityScanning: true
---
# The pull-through mirrors: <upstream>/<image> (Docker Hub's
# official images need library/: docker.io/library/nginx), so the clusters'
# mirror settings stay as they are. Public, filled on first pull. Each
# points at its upstream registry by Harbor's ID (registryId:
# status.atProvider.registryId of the Registry in registries.yaml; the
# provider has no reference for it).
apiVersion: harbor.m.crossplane.io/v1alpha1
kind: Project
metadata:
  name: docker-io
spec:
  managementPolicies: [Observe, Create, Update, LateInitialize]
  providerConfigRef: {kind: ClusterProviderConfig, name: default}
  forProvider:
    name: docker.io
    public: true
    registryId: 3   # Registry docker-io
---
