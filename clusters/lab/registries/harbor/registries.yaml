# The upstream registries of the proxy caches (projects.yaml), anonymous
# pulls. Harbor names them; their IDs (status.atProvider.registryId) are
# what the proxy-cache projects point at.
apiVersion: harbor.m.crossplane.io/v1alpha1
kind: Registry
metadata:
  name: docker-io
spec:
  managementPolicies: [Observe, Create, Update, Delete, LateInitialize]
  providerConfigRef: {kind: ClusterProviderConfig, name: default}
  forProvider: {name: docker.io, providerName: docker-hub, endpointUrl: https://hub.docker.com}
---
