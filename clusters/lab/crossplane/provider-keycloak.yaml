# provider-keycloak (crossplane-contrib): Keycloak realms, clients, groups...
# as managed resources. v3.1.0: its keycloak_version credential lets a
# service account without master's view-system log in (single-realm setup).
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-keycloak
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-keycloak:v3.1.0
  runtimeConfigRef:
    name: provider-keycloak
---
# The provider's pod trusts the site CA besides the public ones: Go reads
# every certificate file of SSL_CERT_DIR, on top of its default bundle.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-keycloak
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              env:
                - {name: SSL_CERT_DIR, value: /etc/site-ca}
              volumeMounts:
                - {name: site-ca, mountPath: /etc/site-ca, readOnly: true}
          volumes:
            - name: site-ca
              configMap: {name: site-root-ca}
---
# Used by every Keycloak managed resource that names no other. Flat keys in
# the Secret (client_id, client_secret, url, realm, keycloak_version): the
# provider reads them one by one when the Secret has no key "credentials".
apiVersion: keycloak.m.crossplane.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: keycloak-credentials
      key: credentials
