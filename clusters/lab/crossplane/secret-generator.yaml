# Decrypts the SOPS-encrypted Secrets of this folder (KSOPS, in Argo CD's
# repo server). Edit one with: cd clusters/lab && SOPS_AGE_KEY_FILE=<key> sops edit crossplane/<file>
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: crossplane-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - secret-crossplane-system-keycloak-credentials.enc.yaml   # provider-keycloak's login (client crossplane-lab)
  - secret-crossplane-system-forgejo-credentials.enc.yaml    # provider-forgejo's login (user crossplane-lab)
  - secret-crossplane-system-harbor-credentials.enc.yaml      # provider-harbor's login (Harbor's admin)
  - secret-crossplane-system-artifact-keeper-credentials.enc.yaml # provider-artifact-keeper's login (admin API token crossplane-lab)
