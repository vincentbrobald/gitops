# The PaC controller (webhook receiver) on the ingress gateway, https://pac.apps.lab.example.org.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pipelines-as-code-controller
  namespace: pipelines-as-code
spec:
  parentRefs:
    # HTTPS only (listener https-pac, certificate from lab.yaml's
    # certManager.extraHosts): every Forgejo webhook calls https://.
    - {name: ingress, namespace: ingress, sectionName: https-pac}
  hostnames: [pac.apps.lab.example.org]   # also the controller-url (kustomization.yaml)
  rules:
    - backendRefs:
        - {name: pipelines-as-code-controller, port: 8080}
