# The Keycloak client of oauth2-proxy (tekton-lab, realm example) and its
# "groups" claim, managed by Crossplane (provider-keycloak,
# clusters/lab/crossplane): a change here reaches Keycloak, a change made in
# Keycloak's console is undone. Crossplane never deletes them: no Delete in
# managementPolicies (namespaced resources of Crossplane v2 have no
# deletionPolicy; this is how they orphan), so removing this file, or Argo
# CD pruning it, leaves them in Keycloak. Taken over from Ansible (infra
# roles/keycloak_realm); undo: infra docs/how-to/hand-back-to-ansible.md.
#
# The client's secret stays the one Keycloak has (nothing sets it here);
# Crossplane publishes it in Secret tekton-lab-oidc (key clientSecret).
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha2
kind: Client
metadata:
  name: tekton-lab
  namespace: tekton-dashboard
spec:
  managementPolicies: [Observe, Create, Update]
  providerConfigRef: {kind: ClusterProviderConfig, name: default}
  writeConnectionSecretToRef: {name: tekton-lab-oidc}
  forProvider:
    realmId: example
    clientId: tekton-lab
    name: Tekton Dashboard (lab)
    enabled: true
    accessType: CONFIDENTIAL
    # Browser login only (oauth2-proxy, authorization code flow).
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    validRedirectUris: ["https://tekton.apps.lab.example.org/oauth2/callback"]
    webOrigins: ["https://tekton.apps.lab.example.org"]
    validPostLogoutRedirectUris: ["https://tekton.apps.lab.example.org"]
    frontchannelLogoutEnabled: false
    backchannelLogoutSessionRequired: true
    fullScopeAllowed: true
    consentRequired: false
    # Keycloak's default; set because the provider reads unset as false.
    useRefreshTokens: true
---
# Group memberships as a flat "groups" claim (names, not paths): oauth2-proxy
# admits the group k8s-admins.
apiVersion: openidgroup.keycloak.m.crossplane.io/v1alpha1
kind: GroupMembershipProtocolMapper
metadata:
  name: tekton-lab-groups
  namespace: tekton-dashboard
spec:
  managementPolicies: [Observe, Create, Update]
  providerConfigRef: {kind: ClusterProviderConfig, name: default}
  forProvider:
    realmId: example
    clientIdRef: {name: tekton-lab}   # the Client above (its UUID)
    name: groups
    claimName: groups
    fullPath: false
    addToIdToken: true
    addToAccessToken: true
    addToUserinfo: true
    addToTokenIntrospection: true
