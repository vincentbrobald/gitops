# Decrypts the SOPS-encrypted Secrets of this folder (KSOPS, in Argo CD's
# repo server). Edit one with: cd clusters/lab && SOPS_AGE_KEY_FILE=<key> sops edit tekton/dashboard/<file>
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: tekton-dashboard-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - secret-tekton-dashboard-oauth2-proxy.enc.yaml   # cookie secret (the client secret comes from Crossplane)
