# Artifact Keeper's content and settings, through Crossplane (the package
# registry under evaluation):
# clusters/lab/registries/artifact-keeper (namespace artifacts-config: its
# managed resources).
# Hand-written: deploy-talos.py leaves this file alone.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: artifact-keeper
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: platform-services
  source:
    repoURL: ssh://git@forgejo.example.org:2222/alice/gitops.git
    targetRevision: main
    path: clusters/lab/registries/artifact-keeper
  destination:
    server: https://kubernetes.default.svc
    namespace: artifacts-config
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true, SkipDryRunOnMissingResource=true]
    retry: {limit: 10, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
