# What the cleanup may do: read Crossplane's managed resources (the
# providers' aggregate-to-view roles: those kinds only, no Secrets), find the
# managed kinds (CRDs), read Applications, and annotate and delete
# namespaces. It deletes only namespaces that opted in (cleanup.py).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: namespace-cleanup
  namespace: namespace-cleanup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: namespace-cleanup:crossplane-view
# No rules here: Kubernetes fills them from the selected roles, and a
# "rules: []" would make Argo CD claim the field and report a difference.
aggregationRule:
  clusterRoleSelectors:
    - matchLabels: {rbac.crossplane.io/aggregate-to-view: "true"}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: namespace-cleanup
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, patch, delete]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: namespace-cleanup:crossplane-view
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: namespace-cleanup:crossplane-view}
subjects:
  - {kind: ServiceAccount, name: namespace-cleanup, namespace: namespace-cleanup}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: namespace-cleanup
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: namespace-cleanup}
subjects:
  - {kind: ServiceAccount, name: namespace-cleanup, namespace: namespace-cleanup}
