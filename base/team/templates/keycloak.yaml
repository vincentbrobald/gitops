{{- if eq .Values.component "core" }}
# Keycloak (realm {{ .Values.realm }}), through Crossplane (provider-keycloak).
# The group and the client are kept in Keycloak when this goes (no Delete);
# the member list is authoritative: a member added in the console is removed.
# LateInitialize: Keycloak names these objects (an ID), which Crossplane
# learns after the creation and saves as the external name only through a
# late-initialization update; without it, a provider restart would lose the
# ID and create the object again.
apiVersion: group.keycloak.m.crossplane.io/v1alpha1
kind: Group
metadata:
  name: team-{{ .Values.team }}
  namespace: {{ include "team.ns" . }}
spec:
  managementPolicies: [Observe, Create, Update, LateInitialize]
  {{- include "team.crossplane" . | nindent 2 }}
  forProvider:
    realmId: {{ .Values.realm }}
    name: team-{{ .Values.team }}
    description: {{ .Values.description | quote }}
---
apiVersion: group.keycloak.m.crossplane.io/v1alpha1
kind: Memberships
metadata:
  name: team-{{ .Values.team }}
  namespace: {{ include "team.ns" . }}
spec:
  {{- include "team.crossplane" . | nindent 2 }}
  forProvider:
    realmId: {{ .Values.realm }}
    groupIdRef: {name: team-{{ .Values.team }}}
    members:
      {{- toYaml .Values.members | nindent 6 }}
---
# The team's Argo CD logs in with this public client (PKCE, no secret).
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha2
kind: Client
metadata:
  name: {{ include "team.client" . }}
  namespace: {{ include "team.ns" . }}
spec:
  managementPolicies: [Observe, Create, Update, LateInitialize]
  {{- include "team.crossplane" . | nindent 2 }}
  forProvider:
    realmId: {{ .Values.realm }}
    clientId: {{ include "team.client" . }}
    name: Argo CD of team {{ .Values.team }} ({{ .Values.cluster }})
    enabled: true
    accessType: PUBLIC
    pkceCodeChallengeMethod: S256
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    # UI (PKCE in the browser) and the CLI (argocd login --sso).
    validRedirectUris:
      - https://{{ include "team.host" . }}/pkce/verify
      - https://{{ include "team.host" . }}/auth/callback
      - http://localhost:8085/auth/callback
    webOrigins: ["https://{{ include "team.host" . }}"]
    validPostLogoutRedirectUris: ["https://{{ include "team.host" . }}"]
    frontchannelLogoutEnabled: false
    fullScopeAllowed: true
    consentRequired: false
    useRefreshTokens: true
---
# Group memberships as a flat "groups" claim: the Argo CD's RBAC admits
# team-{{ .Values.team }} (and the platform's argocd-admins).
apiVersion: openidgroup.keycloak.m.crossplane.io/v1alpha1
kind: GroupMembershipProtocolMapper
metadata:
  name: {{ include "team.client" . }}-groups
  namespace: {{ include "team.ns" . }}
spec:
  managementPolicies: [Observe, Create, Update, LateInitialize]
  {{- include "team.crossplane" . | nindent 2 }}
  forProvider:
    realmId: {{ .Values.realm }}
    clientIdRef: {name: {{ include "team.client" . }}}
    name: groups
    claimName: groups
    fullPath: false
    addToIdToken: true
    addToAccessToken: true
    addToUserinfo: true
    addToTokenIntrospection: true
{{- end }}
