{{- if eq .Values.component "core" }}
# Team members may look at their namespace (kubectl through Keycloak: groups
# arrive prefixed oidc:). Changes go through the team's Argo CD and Git.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: team-view
  namespace: {{ include "team.ns" . }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects:
  - {apiGroup: rbac.authorization.k8s.io, kind: Group, name: oidc:team-{{ .Values.team }}}
{{- end }}
