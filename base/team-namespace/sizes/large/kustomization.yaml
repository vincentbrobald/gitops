# Quota size large, for an environment overlay: components: [<path>/base/team-namespace/sizes/large]
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: {kind: ResourceQuota, name: platform}
    patch: |
      - {op: replace, path: /spec/hard/requests.cpu, value: "4"}
      - {op: replace, path: /spec/hard/requests.memory, value: 8Gi}
      - {op: replace, path: /spec/hard/limits.memory, value: 16Gi}
      - {op: replace, path: /spec/hard/pods, value: "80"}
      - {op: replace, path: /spec/hard/persistentvolumeclaims, value: "20"}
      - {op: replace, path: /spec/hard/requests.storage, value: 100Gi}
