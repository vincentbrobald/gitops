# Quota size medium, for an environment overlay: components: [<path>/base/team-namespace/sizes/medium]
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: {kind: ResourceQuota, name: platform}
    patch: |
      - {op: replace, path: /spec/hard/requests.cpu, value: "2"}
      - {op: replace, path: /spec/hard/requests.memory, value: 4Gi}
      - {op: replace, path: /spec/hard/limits.memory, value: 8Gi}
      - {op: replace, path: /spec/hard/pods, value: "40"}
      - {op: replace, path: /spec/hard/persistentvolumeclaims, value: "10"}
      - {op: replace, path: /spec/hard/requests.storage, value: 50Gi}
