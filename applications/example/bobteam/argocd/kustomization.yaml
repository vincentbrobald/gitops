# Generated by tools/teams.py: do not edit, run 'python3 tools/teams.py generate'
# (the merge check compares).
# How the Argo CD of team bobteam reads the team's repositories on cluster
# lab: one read-only deploy key on each, whose private half is the Argo CD
# credential template repo-credentials.enc.yaml (SOPS) for
# ssh://git@forgejo.example.org:2222/example/bobteam-*. Synced with the team's platform part
# (Application team-bobteam, second source). argocd-namespaces.yaml is a values
# file of the team's Argo CD (Application team-bobteam-argocd), not part of this.
# The CI's Secrets (ci-*.enc.yaml): the password of the team's Forgejo user
# ci-bobteam and its webhooks' secret (base/team, ci.yaml). Each object names
# its namespace (team-bobteam, ci-bobteam).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deploy-keys.yaml
generators:
  - secret-generator.yaml
# When the team is removed, Crossplane still signs in as ci-bobteam with this
# password to delete the user's token: Argo CD keeps the Secret, and the
# namespace cleanup deletes it with team-bobteam.
patches:
  - patch: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: forgejo-bot
        namespace: team-bobteam
        annotations:
          argocd.argoproj.io/sync-options: Delete=false
