# Team "aliceteam" of organization example: the directory name is the team's name
# (docs/reference/team-files.md). Makes the Keycloak group team-aliceteam, the Forgejo team aliceteam,
# its repositories, the namespace team-aliceteam and the team's Argo CD
# (https://argocd-aliceteam.apps.<cluster>.example.org). The directories next to
# this file are the team's application namespaces (docs/reference/team-namespaces.md).
description: Team aliceteam
# Keycloak user names; the same names in Forgejo.
members:
  - alice
# Repositories besides aliceteam-gitops (always made: its apps/ is what the team's
# Argo CD syncs). Names start with "aliceteam-"; each is the team's, private, and
# readable by its Argo CD.
repositories: []
