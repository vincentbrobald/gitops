# Team "platform" of organization example: the directory name is the team's name
# (docs/reference/team-files.md). Makes the Keycloak group team-platform, the Forgejo team platform,
# its repositories, the namespace team-platform and the team's Argo CD
# (https://argocd-platform.apps.<cluster>.example.org). The directories next to
# this file are the team's application namespaces (docs/reference/team-namespaces.md).
description: The platform team (cluster, gitops, shared services)
# Keycloak user names; the same names in Forgejo.
members:
  - alice
# Repositories besides platform-gitops (always made: its apps/ is what the team's
# Argo CD syncs). Names start with "platform-"; each is the team's, private, and
# readable by its Argo CD.
repositories:
  - platform-hello     # the demo application (docs/tutorials/onboard-a-team.md)
